[package]
name = "dsh-desktop"
version = "1.2.3"
edition = "2021"
description = "Desktop shell for the DeepSeek Harness CLI (@deepseek-ai/dsh)"
license = "MIT"

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[dependencies]
tao = "0.36"
wry = "0.56"
url = "2"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.19.3"

[profile.release]
opt-level = "z"
lto = true
strip = true
