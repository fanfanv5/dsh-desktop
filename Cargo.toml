[package]
name = "dsh-desktop"
version = "0.1.0"
edition = "2021"
description = "Windows desktop shell for the DeepSeek Harness CLI (@deepseek-ai/dsh)"
license = "MIT"

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-winres = "0.3"

[dependencies]
tao = "0.36"
wry = "0.56"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
