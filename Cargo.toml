[package]
name = "dsh-desktop"
version = "1.0.0"
edition = "2021"
description = "Desktop shell for the DeepSeek Harness CLI (@deepseek-ai/dsh)"
license = "MIT"

[[bin]]
name = "dsh-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-winres = "0.3"

[dependencies]
tao = "0.36"
wry = "0.56"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
