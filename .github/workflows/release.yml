name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Package (Inno Setup)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe" -OutFile "$env:RUNNER_TEMP\inno.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\inno.exe" -ArgumentList "/VERYSILENT","/PORTABLE=1","/DIR=$env:RUNNER_TEMP\inno","/SUPPRESSMSGBOXES","/NORESTART"
          & "$env:RUNNER_TEMP\inno\ISCC.exe" installer\dsh-desktop.iss
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-windows-x64
          path: dist/DSH-Desktop-Setup-*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
      - name: Build (aarch64)
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build (x86_64)
        run: cargo build --release --target x86_64-apple-darwin
      - name: Package (universal .app + .dmg)
        run: |
          set -e
          mkdir -p "DSH Desktop.app/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/dsh-desktop \
            target/x86_64-apple-darwin/release/dsh-desktop \
            -output "DSH Desktop.app/Contents/MacOS/dsh-desktop"
          cat > "DSH Desktop.app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>DSH Desktop</string>
            <key>CFBundleDisplayName</key><string>DSH Desktop</string>
            <key>CFBundleIdentifier</key><string>com.dshdesktop.app</string>
            <key>CFBundleVersion</key><string>1.1.0</string>
            <key>CFBundleShortVersionString</key><string>1.1.0</string>
            <key>CFBundleExecutable</key><string>dsh-desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
          hdiutil create -volname "DSH Desktop" -srcfolder "DSH Desktop.app" -ov -format UDZO "DSH-Desktop-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-macos-universal
          path: DSH-Desktop-macos-universal.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build
        run: cargo build --release
      - name: Package (tar.gz)
        run: |
          set -e
          mkdir -p pkg/DSHDesktop
          cp target/release/dsh-desktop pkg/DSHDesktop/
          cat > pkg/DSHDesktop/dsh-desktop.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=DSH Desktop
          Comment=DeepSeek Harness desktop shell
          Exec=dsh-desktop
          Terminal=false
          Categories=Development;Utility;
          EOF
          cat > pkg/DSHDesktop/install.sh <<'EOF'
          #!/bin/sh
          set -e
          sudo cp dsh-desktop /usr/local/bin/
          sudo cp dsh-desktop.desktop /usr/share/applications/
          echo "Installed DSH Desktop to /usr/local/bin/dsh-desktop"
          EOF
          chmod +x pkg/DSHDesktop/install.sh
          tar -czf DSH-Desktop-linux-x64.tar.gz -C pkg DSHDesktop
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-linux-x64
          path: DSH-Desktop-linux-x64.tar.gz

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
